name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version from tag (v1.2.3 -> 1.2.3)
        id: ver
        shell: pwsh
        run: |
          $v = "1.0.0"
          if ("${{ github.ref }}" -like "refs/tags/v*") { $v = "${{ github.ref_name }}".Substring(1) }
          "version=$v" >> $env:GITHUB_OUTPUT
          "building version $v"

      - name: Build (Release, .NET Framework 4.8)
        run: dotnet build tkdrop/tkdrop.csproj -c Release -p:ContinuousIntegrationBuild=true -p:Version=${{ steps.ver.outputs.version }}

      - name: Check single-exe output
        shell: pwsh
        run: |
          $out = "tkdrop/bin/Release/net48"
          Get-ChildItem $out
          $exe = Join-Path $out "tkdrop.exe"
          if (-not (Test-Path $exe)) { throw "tkdrop.exe not produced" }
          # Copy ONLY the exe to a clean folder: the self-test must run without the loose 32feet DLL.
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe dist/tkdrop.exe
          "exe size: {0:N0} bytes" -f (Get-Item dist/tkdrop.exe).Length

      - name: Self-test (protocol + embedded assembly, no Bluetooth needed)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path dist/tkdrop.exe) -ArgumentList "--selftest", (Join-Path $PWD "selftest.txt") -Wait -PassThru -NoNewWindow
          if (Test-Path selftest.txt) { Get-Content selftest.txt } else { Write-Host "no report written" }
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - name: Upload exe
        uses: actions/upload-artifact@v7
        with:
          name: tkdrop
          path: dist/tkdrop.exe
          if-no-files-found: error

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/tkdrop.exe
          generate_release_notes: true
